<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile CTR Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
    }
    #camera, #canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .banner {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: rgba(0, 0, 0, 0.2); /* semi-transparent black background */
      z-index: 999; /* Ensure the banner stays on top of other content */
    }
    .slider{
      width: 100%;
    }
    #button-container {
      position: absolute;
      bottom: 20px;
      right: 20px;
    }
  </style>
</head>

<body>
    <div class="banner">
      <div class="row d-flex justify-content-center align-items-center">
        <div class="col-sm-6">
          <input class="slider" type="range" min="-3.14" max="3.14" step="0.02" id="ang_slider" disabled>
        </div>
      </div>
    </div>
    <video id="camera" playsinline style="display: none"></video>
    <canvas id="canvas"></canvas>
    <div id="button-container">
      <button type="button" class="btn btn-primary" id="reset">Reset</button>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.6.0/math.js" integrity="sha512-RefYJFvLbj6WnGkdf40i7tlnvORh5VhCXuyaYRrj0hu5y0aHMCO1ROPLnRfMzbZ7SJqCYaQ92EAsGf9OyY9BNQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.1/jquery.min.js'></script>
    <script src="../libs/const.js"></script>
    <script src="../libs/color.js"></script>
    <script src="./cam.js"></script>
</body>
</html>
